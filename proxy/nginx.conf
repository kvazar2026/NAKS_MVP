# Reverse proxy in front of backend + frontend (ticket 07 — Docker Compose).
#
# Single origin for the local iframe scenario: the frontend widget and the
# backend API are reachable under one host/port, avoiding cross-origin calls
# during local testing (tickets 05/08).
#
# Forwards real client-address headers on every location so that backend
# rate limiting (ticket 06, not implemented yet) has a real reverse proxy to
# trust and read X-Forwarded-For from once it exists — this file does not
# implement any rate limiting itself.

server {
    listen 80;
    server_name _;

    # Survey/document payloads are small JSON; keeps oversized bodies from
    # ever reaching the backend. Ticket 06 may tighten this further once its
    # own request-size limit exists.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's embedded DNS server: re-resolves backend/frontend with a
    # short TTL instead of caching their IP for this proxy container's
    # whole lifetime, so restarting backend or frontend alone (a likely
    # rate-limiting/dev iteration workflow, without restarting proxy) does
    # not leave nginx stuck pointing at a stale, no-longer-valid IP.
    resolver 127.0.0.11 valid=10s;

    # Backend API, forwarded verbatim (no path rewrite): the "/api/" prefix
    # is part of the backend's own route paths.
    location /api/ {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend;
    }

    # Backend health check, exposed through the single public origin so it
    # can be verified the same way as in production topology.
    location = /health {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend/health;
    }

    # Everything else: the frontend widget SPA.
    location / {
        set $upstream_frontend frontend:80;
        proxy_pass http://$upstream_frontend;
    }
}
