# Static file server for the widget SPA build (ticket 07 — Docker Compose).
# Fronted by the reverse proxy in ../proxy/nginx.conf for the iframe
# scenario; this config only serves this container's own static files and
# its own container-local healthcheck.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by this service's own Docker healthcheck (see Dockerfile) — kept
    # independent of index.html so a broken build still reports unhealthy
    # instead of masking it behind a 200.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Single-page app: unmatched paths fall back to index.html. There is no
    # client-side routing yet, but this keeps future deep links working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
